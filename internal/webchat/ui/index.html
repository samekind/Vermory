<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Vermory conversation continuity Web Chat.">
  <title>Vermory</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span>Vermory</span>
      </a>
      <div class="connection" id="connection-status" role="status" aria-live="polite">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connection-label">Connecting</span>
      </div>
      <button class="primary-command" id="new-thread" type="button">New conversation</button>
    </header>

    <nav class="mobile-tabs" aria-label="Web Chat views">
      <button type="button" data-view="threads">Conversations</button>
      <button class="is-active" type="button" data-view="chat">Chat</button>
      <button type="button" data-view="memory">Memory <span id="mobile-memory-count"></span></button>
    </nav>

    <main class="workspace" data-mobile-view="chat">
      <aside class="thread-rail" aria-labelledby="thread-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Recent</p>
            <h1 id="thread-heading">Conversations</h1>
          </div>
          <button class="icon-command" id="new-thread-compact" type="button" title="New conversation" aria-label="New conversation"><span aria-hidden="true">+</span></button>
        </div>
        <div class="thread-list" id="thread-list"></div>
      </aside>

      <section class="chat-surface">
        <div class="chat-heading">
          <div>
            <p class="eyebrow">Current conversation</p>
            <h2 id="active-thread-title">Untitled conversation</h2>
          </div>
          <span class="sync-state" id="sync-state">Ready</span>
        </div>

        <div class="transcript" id="transcript" aria-live="polite" aria-busy="false"></div>

        <form class="composer" id="composer">
          <label class="sr-only" for="message-input">Message</label>
          <textarea id="message-input" rows="1" maxlength="131072" placeholder="Message Vermory" required></textarea>
          <div class="composer-actions">
            <span id="composer-note">Current conversation only</span>
            <button class="send-command" id="send-message" type="submit">Send</button>
          </div>
        </form>
      </section>

      <aside class="memory-rail" aria-labelledby="memory-heading">
        <div class="panel-heading memory-heading">
          <div>
            <p class="eyebrow">Current conversation</p>
            <h2 id="memory-heading">Memory</h2>
          </div>
          <span class="count-badge" id="memory-count">0</span>
        </div>
        <div class="segmented-control" role="tablist" aria-label="Memory views">
          <button class="is-active" id="remembered-tab" type="button" role="tab" aria-selected="true" data-memory-view="remembered">Remembered</button>
          <button id="review-tab" type="button" role="tab" aria-selected="false" data-memory-view="review">Review <span id="review-count"></span></button>
        </div>
        <div class="memory-content" id="memory-content"></div>
      </aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
