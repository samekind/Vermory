name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.28
      - name: Install OpenClaw integration dependencies
        run: pnpm -C integrations/openclaw install --frozen-lockfile
      - name: Test Hermes integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          UV_PROJECT_ENVIRONMENT: /tmp/vermory-hermes-release
        run: >-
          uv run --project integrations/hermes --locked --python 3.12
          python -m unittest discover -s integrations/hermes/tests -v
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=publish --config .goreleaser.yaml
      - name: Pack OpenClaw release artifact
        run: pnpm -C integrations/openclaw pack --pack-destination ../../dist
      - name: Pack Hermes release artifact
        run: integrations/hermes/package.sh dist
      - name: Build and verify complete release manifest
        run: |
          bash scripts/release-manifest.sh create dist
          bash scripts/release-manifest.sh verify dist
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify complete release manifest
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.sha256
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            dist/release-manifest.sha256
      - name: Upload release snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vermory-manual-snapshot-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/*.tgz
            dist/vermory-hermes-*.sha256
            dist/release-manifest.sha256
            dist/release-manifest.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.28
      - name: Install OpenClaw integration dependencies
        run: pnpm -C integrations/openclaw install --frozen-lockfile
      - name: Test Hermes integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          UV_PROJECT_ENVIRONMENT: /tmp/vermory-hermes-release
        run: >-
          uv run --project integrations/hermes --locked --python 3.12
          python -m unittest discover -s integrations/hermes/tests -v
      - name: Publish Go archives and checksums
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack OpenClaw release artifact
        run: pnpm -C integrations/openclaw pack --pack-destination ../../dist
      - name: Pack Hermes release artifact
        run: integrations/hermes/package.sh dist
      - name: Build and verify complete release manifest
        run: |
          bash scripts/release-manifest.sh create dist
          bash scripts/release-manifest.sh verify dist
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify complete release manifest
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.sha256
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            dist/release-manifest.sha256
      - name: Attach OpenClaw package to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
      - name: Attach Hermes package to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/vermory-hermes-*.tar.gz
          dist/vermory-hermes-*.sha256
          --clobber
      - name: Attach signed release manifest to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/release-manifest.sha256
          dist/release-manifest.sigstore.json
          --clobber
      - name: Upload release workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vermory-release-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/*.tgz
            dist/vermory-hermes-*.sha256
            dist/release-manifest.sha256
            dist/release-manifest.sigstore.json
          if-no-files-found: error
          retention-days: 7
